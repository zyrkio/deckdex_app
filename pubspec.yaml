name: deckdex_app
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  bitsdojo_window: ^0.1.5
  english_words: ^4.0.0
  provider: ^6.1.2
  collapsible_sidebar: ^2.0.7
  http: ^1.1.0
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  path: ^1.9.0
  supabase_flutter: ^1.10.11

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/font/
    - assets/images/
  fonts:
    - family: SwissDesign
      fonts:
        - asset: assets/font/swissdesign.otf
